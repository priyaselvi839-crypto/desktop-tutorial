<!DOCTYPE html>
<html>
<head>
  <title></title>
</head>
<body>
<p id="timer"></p>
<script>
 let timer;

function startTimer() {
  let timeLeft = 10;

  clearInterval(timer);

  timer = setInterval(() => {
    document.getElementById("timer").innerText = timeLeft;
    timeLeft--;

    if (timeLeft < 0) {
      clearInterval(timer);
      document.getElementById("timer").innerText = "Done";
    }

  }, 1000);
}

startTimer();
</script>
</body>
</html>
